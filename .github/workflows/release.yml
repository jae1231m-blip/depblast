name: Release

# Build prebuilt binaries and attach them to the GitHub Release.
# Triggered by pushing a version tag (v*).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: depblast-x86_64-linux
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: depblast-aarch64-linux
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: depblast-aarch64-macos
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: depblast-x86_64-macos
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: depblast-x86_64-windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/depblast${{ matrix.ext }}" "${{ matrix.asset }}${{ matrix.ext }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}${{ matrix.ext }}
          fail_on_unmatched_files: true
